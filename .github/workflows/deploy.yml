# EVALU8 — CI/CD Pipeline
# Builds the frontend on every push, and deploys to Azure VM on main branch.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   VM_HOST       — Public IP of your Azure VM (e.g. 20.123.45.67)
#   VM_USER       — SSH username (usually "azureuser")
#   VM_SSH_KEY    — Private SSH key for the VM (contents of ~/.ssh/id_rsa)
#   VM_DOMAIN     — (optional) Your custom domain, e.g. equalu8.me

name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── CI: Build & Test ──
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

  # ── CD: Deploy to Azure VM ──
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /home/azureuser/evalu8
            git pull origin main
            npm install
            npm run build
            source .venv/bin/activate
            pip install -r requirements.txt
            deactivate
            pm2 restart evalu8-server
            echo "✅ Deployed at $(date)"

      - name: Verify deployment
        run: |
          sleep 5
          curl -s -o /dev/null -w "HTTP %{http_code}" http://${{ secrets.VM_HOST }}/api/health || true
          echo ""
